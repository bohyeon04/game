<!doctype html><html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>네온 벽돌깨기</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at top,#1c2754,#090d20 70%);color:#fff;font-family:system-ui,'Malgun Gothic',sans-serif;display:grid;place-items:center}.wrap{width:min(96vw,680px);text-align:center}h1{margin:14px 0 5px;font-size:clamp(26px,5vw,40px);letter-spacing:2px}.sub{color:#a8b5e6;margin:0 0 16px}.stats{display:flex;justify-content:space-around;gap:10px;margin-bottom:12px}.stat{background:#ffffff13;border:1px solid #ffffff26;border-radius:13px;padding:10px;flex:1}.stat strong{display:block;font-size:23px;color:#80f7ef}canvas{width:100%;aspect-ratio:3/4;max-height:70vh;background:linear-gradient(#111b3d,#0a1128);border:2px solid #5a74b5;border-radius:16px;box-shadow:0 0 35px #2c70d43a;touch-action:none;display:block}button{border:0;border-radius:12px;background:#62e8e0;color:#0c1830;font-weight:800;font-size:16px;padding:12px 22px;cursor:pointer;margin:12px 5px}button.secondary{background:#34436e;color:#fff}.help{font-size:13px;color:#b4c2e9;margin:0 0 20px}</style></head><body><main class="wrap"><h1>⚡ 네온 벽돌깨기</h1><p class="sub">공을 튕겨 모든 벽돌을 깨보세요!</p><div class="stats"><div class="stat">점수<strong id="score">0</strong></div><div class="stat">목숨<strong id="lives">3</strong></div><div class="stat">레벨<strong id="level">1</strong></div></div><canvas id="game" width="600" height="800" aria-label="벽돌깨기 게임 화면"></canvas><button id="start">게임 시작</button><button class="secondary" id="pause">일시정지</button><p class="help">마우스 · 터치 · ← → 키로 패들 이동 / 스페이스바로 시작·일시정지</p></main><script>
const c=document.getElementById('game'),x=c.getContext('2d'),scoreEl=document.getElementById('score'),livesEl=document.getElementById('lives'),levelEl=document.getElementById('level'),startBtn=document.getElementById('start'),pauseBtn=document.getElementById('pause');let score=0,lives=3,level=1,state='ready',bricks=[],keys={},last=0;const W=600,H=800,p={x:250,y:745,w:100,h:15},b={x:300,y:720,vx:3.2,vy:-5.2,r:9};const colors=['#fa7194','#ffbc69','#f9e875','#75e4ba','#70baff','#b48dff'];function build(){bricks=[];const rows=Math.min(4+level,9),cols=9,gap=7,pad=30,bw=(W-2*pad-(cols-1)*gap)/cols;for(let r=0;r<rows;r++)for(let col=0;col<cols;col++)bricks.push({x:pad+col*(bw+gap),y:95+r*33,w:bw,h:24,alive:true,color:colors[r%colors.length]})}function resetBall(){p.x=(W-p.w)/2;b.x=W/2;b.y=p.y-18;let speed=5.5+level*.45;b.vx=(Math.random()>.5?1:-1)*speed*.58;b.vy=-speed*.82}function hud(){scoreEl.textContent=score;livesEl.textContent=lives;levelEl.textContent=level}function newGame(){score=0;lives=3;level=1;build();resetBall();state='playing';hud();startBtn.textContent='다시 시작'}function toggle(){if(state==='ready'||state==='over'||state==='won')newGame();else if(state==='playing')state='paused';else if(state==='paused')state='playing';pauseBtn.textContent=state==='paused'?'계속하기':'일시정지'}function move(e){const rect=c.getBoundingClientRect();p.x=Math.max(0,Math.min(W-p.w,(e.clientX-rect.left)*W/rect.width-p.w/2));if(state==='ready')b.x=p.x+p.w/2}c.addEventListener('pointermove',move);c.addEventListener('pointerdown',e=>{move(e);if(state==='ready')newGame()});window.addEventListener('keydown',e=>{if(['ArrowLeft','ArrowRight','Space'].includes(e.code))e.preventDefault();keys[e.code]=true;if(e.code==='Space'&&!e.repeat)toggle()});window.addEventListener('keyup',e=>keys[e.code]=false);startBtn.onclick=newGame;pauseBtn.onclick=toggle;function update(dt){if(state!=='playing')return;if(keys.ArrowLeft)p.x-=8*dt;if(keys.ArrowRight)p.x+=8*dt;p.x=Math.max(0,Math.min(W-p.w,p.x));let ox=b.x,oy=b.y;b.x+=b.vx*dt;b.y+=b.vy*dt;if(b.x-b.r<0){b.x=b.r;b.vx=Math.abs(b.vx)}if(b.x+b.r>W){b.x=W-b.r;b.vx=-Math.abs(b.vx)}if(b.y-b.r<0){b.y=b.r;b.vy=Math.abs(b.vy)}if(b.vy>0&&oy+b.r<=p.y+7&&b.y+b.r>=p.y&&b.x>=p.x-5&&b.x<=p.x+p.w+5){b.y=p.y-b.r;let ratio=(b.x-(p.x+p.w/2))/(p.w/2),speed=Math.min(10,Math.hypot(b.vx,b.vy)+.06);b.vx=ratio*speed*.82;b.vy=-Math.sqrt(Math.max(8,speed*speed-b.vx*b.vx))}for(const a of bricks){if(!a.alive)continue;if(b.x+b.r>a.x&&b.x-b.r<a.x+a.w&&b.y+b.r>a.y&&b.y-b.r<a.y+a.h){a.alive=false;score+=10;hud();const fromSide=ox+b.r<=a.x||ox-b.r>=a.x+a.w;if(fromSide)b.vx*=-1;else b.vy*=-1;break}}if(bricks.every(a=>!a.alive)){level++;if(level>5){state='won'}else{build();resetBall()}hud()}if(b.y-b.r>H){lives--;hud();if(lives<=0)state='over';else resetBall()}}function rounded(a,b,w,h,r){x.beginPath();x.roundRect(a,b,w,h,r)}function draw(){x.clearRect(0,0,W,H);x.fillStyle='#ffffff08';for(let i=0;i<24;i++){x.beginPath();x.arc((i*127)%W,(i*193)%H,1.5,0,Math.PI*2);x.fill()}for(const a of bricks){if(!a.alive)continue;x.shadowColor=a.color;x.shadowBlur=12;x.fillStyle=a.color;rounded(a.x,a.y,a.w,a.h,5);x.fill();x.shadowBlur=0;x.fillStyle='#ffffff45';x.fillRect(a.x+5,a.y+4,a.w-10,3)}x.shadowColor='#60fff2';x.shadowBlur=22;x.fillStyle='#6ff6ed';rounded(p.x,p.y,p.w,p.h,8);x.fill();x.shadowBlur=18;x.fillStyle='#fff';x.beginPath();x.arc(b.x,b.y,b.r,0,Math.PI*2);x.fill();x.shadowBlur=0;if(state!=='playing'){x.fillStyle='#050b1bc9';rounded(65,330,470,155,20);x.fill();x.textAlign='center';x.fillStyle='#fff';x.font='bold 34px system-ui';x.fillText(state==='paused'?'일시정지':state==='over'?'게임 오버':state==='won'?'🎉 모든 레벨 클리어!':'준비됐나요?',300,392);x.font='18px system-ui';x.fillStyle='#b9d4ff';x.fillText(state==='ready'?'게임 시작 버튼을 눌러주세요':state==='paused'?'스페이스바로 계속하기':state==='over'||state==='won'?'다시 시작 버튼으로 재도전':'',300,430)}}function frame(t){let dt=Math.min((t-last)/16.67||1,2);last=t;update(dt);draw();requestAnimationFrame(frame)}build();resetBall();hud();requestAnimationFrame(frame);
</script></body></html>
