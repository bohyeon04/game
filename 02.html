<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>우주선 피하기</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at top,#27234b,#090c1b 75%);font-family:system-ui,sans-serif;color:white;display:grid;place-items:center}.wrap{text-align:center;width:min(96vw,520px)}h1{color:#bba7ff;letter-spacing:2px;margin:12px 0 5px}p{color:#bdc2df}.stats{display:flex;justify-content:space-around;background:#ffffff12;padding:12px;border-radius:14px;margin:15px 0}canvas{width:min(94vw,420px);height:auto;border:2px solid #a28bff;border-radius:14px;background:#0b1025;touch-action:none;box-shadow:0 0 28px #765cff44}button{background:#a995ff;border:0;border-radius:10px;padding:12px 20px;margin:7px;font-weight:800;color:#100d24;cursor:pointer}.secondary{background:#34375c;color:white}.controls{display:flex;justify-content:center;gap:18px}.controls button{font-size:22px;min-width:90px;touch-action:none}</style><div class="wrap"><h1>🚀 SPACE DODGE</h1><p>떨어지는 운석을 피해 최대한 오래 버티세요!</p><div class="stats"><span>점수 <b id="score">0</b></span><span>최고 기록 <b id="best">0</b></span><span id="status">시작 대기</span></div><canvas id="game" width="420" height="560"></canvas><div><button id="start">게임 시작 / 재시작</button><button id="pause" class="secondary">일시정지</button></div><div class="controls"><button id="left">◀</button><button id="right">▶</button></div><p>← → / A D / 터치 드래그로 이동 · 스페이스바 일시정지</p></div><script>const c=document.getElementById('game'),g=c.getContext('2d'),$=id=>document.getElementById(id);let x=210,rocks=[],stars=Array.from({length:65},()=>({x:Math.random()*420,y:Math.random()*560,r:Math.random()*1.6+.4})),keys={},score=0,best=Number(localStorage.getItem('dodgeBest')||0),mode='idle',last=0,spawn=0,frame=0;$('best').textContent=best;function start(){x=210;rocks=[];score=0;spawn=0;last=0;mode='play';$('status').textContent='플레이 중';$('score').textContent=0;requestAnimationFrame(loop)}function pause(){if(mode==='play'){mode='pause';$('status').textContent='일시정지';draw()}else if(mode==='pause'){mode='play';last=0;$('status').textContent='플레이 중';requestAnimationFrame(loop)}}function end(){mode='over';$('status').textContent='게임 오버';if(score>best){best=score;localStorage.setItem('dodgeBest',best);$('best').textContent=best}draw()}function loop(t){if(mode!=='play')return;if(!last)last=t;let dt=Math.min((t-last)/16.67,2.5);last=t;frame+=dt;score+=dt/6;$('score').textContent=Math.floor(score);if(keys.left)x-=6.4*dt;if(keys.right)x+=6.4*dt;x=Math.max(22,Math.min(398,x));spawn+=dt;let interval=Math.max(14,48-score/22);if(spawn>=interval){spawn=0;let r=13+Math.random()*17;rocks.push({x:r+Math.random()*(420-2*r),y:-r,r,vy:2.6+Math.min(score/65,6)+Math.random()*1.8})}for(let rock of rocks){rock.y+=rock.vy*dt;if(Math.hypot(rock.x-x,rock.y-510)<rock.r+16){end();return}}rocks=rocks.filter(r=>r.y<590);draw();requestAnimationFrame(loop)}function draw(){g.fillStyle='#0b1025';g.fillRect(0,0,420,560);stars.forEach(s=>{g.fillStyle='#c6c5ff99';g.beginPath();g.arc(s.x,s.y,s.r,0,Math.PI*2);g.fill()});rocks.forEach(r=>{g.fillStyle='#ff886b';g.shadowColor='#ff704f';g.shadowBlur=14;g.beginPath();g.arc(r.x,r.y,r.r,0,Math.PI*2);g.fill();g.shadowBlur=0;g.fillStyle='#c44c55';g.beginPath();g.arc(r.x-r.r*.25,r.y-r.r*.2,r.r*.23,0,Math.PI*2);g.fill()});g.save();g.translate(x,510);g.shadowColor='#7bf9ff';g.shadowBlur=18;g.fillStyle='#7cecff';g.beginPath();g.moveTo(0,-24);g.lineTo(-19,20);g.lineTo(0,12);g.lineTo(19,20);g.closePath();g.fill();g.shadowBlur=0;g.fillStyle='#f8ffff';g.fillRect(-4,-2,8,12);g.restore();if(mode!=='play'){g.fillStyle='#080b1ab9';g.fillRect(0,213,420,110);g.textAlign='center';g.fillStyle='white';g.font='bold 27px system-ui';g.fillText(mode==='over'?'GAME OVER':mode==='pause'?'PAUSED':'SPACE DODGE',210,272);g.font='15px system-ui';g.fillText('시작 버튼을 눌러 플레이',210,299)}}$('start').onclick=start;$('pause').onclick=pause;document.addEventListener('keydown',e=>{if(['ArrowLeft','ArrowRight','Space'].includes(e.code))e.preventDefault();if(['ArrowLeft','KeyA'].includes(e.code))keys.left=true;if(['ArrowRight','KeyD'].includes(e.code))keys.right=true;if(e.code==='Space'&&!e.repeat)pause()});document.addEventListener('keyup',e=>{if(['ArrowLeft','KeyA'].includes(e.code))keys.left=false;if(['ArrowRight','KeyD'].includes(e.code))keys.right=false});function hold(id,k){let b=$(id);b.addEventListener('pointerdown',e=>{e.preventDefault();keys[k]=true;b.setPointerCapture(e.pointerId)});['pointerup','pointercancel','lostpointercapture'].forEach(ev=>b.addEventListener(ev,()=>keys[k]=false))}hold('left','left');hold('right','right');function drag(e){let rect=c.getBoundingClientRect();x=Math.max(22,Math.min(398,(e.clientX-rect.left)*420/rect.width))}c.addEventListener('pointerdown',e=>{c.setPointerCapture(e.pointerId);drag(e)});c.addEventListener('pointermove',e=>{if(e.buttons||e.pointerType==='touch')drag(e)});draw();</script></html>
