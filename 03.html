<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>네온 스네이크</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at top,#18324a,#070d19 70%);color:#effaff;font-family:system-ui,sans-serif;display:grid;place-items:center}.wrap{text-align:center;width:min(94vw,560px)}h1{margin:14px 0 4px;letter-spacing:3px;color:#5dfad5}p{color:#a9c5d6}.stats{display:flex;justify-content:space-around;margin:16px 0;background:#ffffff12;border:1px solid #ffffff25;padding:12px;border-radius:14px}canvas{width:min(92vw,480px);height:auto;background:#091625;border:2px solid #4edcc6;border-radius:12px;box-shadow:0 0 30px #28c9b533;touch-action:none}button{border:0;border-radius:10px;padding:12px 20px;margin:7px;background:#40dfbe;color:#071a20;font-weight:800;cursor:pointer}.secondary{background:#29445a;color:white}.pad{display:grid;grid-template-columns:repeat(3,54px);justify-content:center;gap:4px;margin:8px}.pad button{margin:0;padding:10px}.pad .up{grid-column:2}.pad .left{grid-column:1}.pad .down{grid-column:2}.pad .right{grid-column:3;grid-row:2}</style><div class="wrap"><h1>🐍 NEON SNAKE</h1><p>먹이를 먹고 길어지는 뱀을 조종하세요!</p><div class="stats"><span>점수 <b id="score">0</b></span><span>최고 점수 <b id="best">0</b></span><span id="status">시작 대기</span></div><canvas id="game" width="480" height="480"></canvas><div><button id="start">게임 시작 / 재시작</button><button class="secondary" id="pause">일시정지</button></div><div class="pad"><button class="up" data-dir="up">▲</button><button class="left" data-dir="left">◀</button><button class="down" data-dir="down">▼</button><button class="right" data-dir="right">▶</button></div><p>방향키 / WASD / 화면 버튼으로 이동 · 스페이스바 일시정지</p></div><script>const c=document.getElementById('game'),ctx=c.getContext('2d'),N=20,S=24;let snake,food,dir,next,score=0,best=Number(localStorage.getItem('snakeBest')||0),timer=null,mode='idle';const $=id=>document.getElementById(id);$('best').textContent=best;function spawn(){let free=[];for(let y=0;y<N;y++)for(let x=0;x<N;x++)if(!snake.some(p=>p.x===x&&p.y===y))free.push({x,y});return free[Math.floor(Math.random()*free.length)]||null}function reset(){snake=[{x:10,y:10},{x:9,y:10},{x:8,y:10}];dir={x:1,y:0};next=dir;score=0;food=spawn();mode='play';$('score').textContent=0;$('status').textContent='플레이 중';clearInterval(timer);timer=setInterval(step,115);draw()}function end(){mode='over';clearInterval(timer);$('status').textContent='게임 오버';draw()}function step(){dir=next;let h={x:snake[0].x+dir.x,y:snake[0].y+dir.y},eat=food&&h.x===food.x&&h.y===food.y;let body=eat?snake:snake.slice(0,-1);if(h.x<0||h.y<0||h.x>=N||h.y>=N||body.some(p=>p.x===h.x&&p.y===h.y)){end();return}snake.unshift(h);if(eat){score+=10;$('score').textContent=score;if(score>best){best=score;localStorage.setItem('snakeBest',best);$('best').textContent=best}food=spawn();if(!food){mode='won';clearInterval(timer);$('status').textContent='완전 정복!'}}else snake.pop();draw()}function draw(){ctx.fillStyle='#091625';ctx.fillRect(0,0,480,480);ctx.strokeStyle='#183143';ctx.lineWidth=.6;for(let i=0;i<=N;i++){ctx.beginPath();ctx.moveTo(i*S,0);ctx.lineTo(i*S,480);ctx.moveTo(0,i*S);ctx.lineTo(480,i*S);ctx.stroke()}if(food){ctx.fillStyle='#ff718f';ctx.shadowBlur=18;ctx.shadowColor='#ff718f';ctx.beginPath();ctx.arc(food.x*S+12,food.y*S+12,8,0,Math.PI*2);ctx.fill();ctx.shadowBlur=0}if(snake)snake.forEach((p,i)=>{ctx.fillStyle=i===0?'#b5fff0':'#35d6ae';ctx.fillRect(p.x*S+2,p.y*S+2,20,20)});if(mode!=='play'){ctx.fillStyle='#06111cbb';ctx.fillRect(0,195,480,90);ctx.fillStyle='#fff';ctx.textAlign='center';ctx.font='bold 26px system-ui';ctx.fillText(mode==='over'?'GAME OVER':mode==='pause'?'PAUSED':mode==='won'?'YOU WIN!':'NEON SNAKE',240,248)}}function turn(d){let v={up:{x:0,y:-1},down:{x:0,y:1},left:{x:-1,y:0},right:{x:1,y:0}}[d];if(v&&!(v.x===-dir.x&&v.y===-dir.y))next=v}function pause(){if(mode==='play'){mode='pause';clearInterval(timer);$('status').textContent='일시정지'}else if(mode==='pause'){mode='play';timer=setInterval(step,115);$('status').textContent='플레이 중'}draw()}$('start').onclick=reset;$('pause').onclick=pause;document.querySelectorAll('[data-dir]').forEach(b=>b.onclick=()=>turn(b.dataset.dir));document.addEventListener('keydown',e=>{let k=e.key.toLowerCase(),d={arrowup:'up',w:'up',arrowdown:'down',s:'down',arrowleft:'left',a:'left',arrowright:'right',d:'right'}[k];if(d){e.preventDefault();turn(d)}if(e.code==='Space'){e.preventDefault();pause()}});let sx,sy;c.addEventListener('touchstart',e=>{sx=e.touches[0].clientX;sy=e.touches[0].clientY},{passive:true});c.addEventListener('touchend',e=>{if(sx===undefined)return;let dx=e.changedTouches[0].clientX-sx,dy=e.changedTouches[0].clientY-sy;if(Math.max(Math.abs(dx),Math.abs(dy))>20)turn(Math.abs(dx)>Math.abs(dy)?dx>0?'right':'left':dy>0?'down':'up');sx=undefined});draw();</script></html>
